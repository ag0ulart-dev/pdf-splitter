<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>PDF — Ferramentas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">FERRAMENTAS PARA DOCUMENTOS</p>
            <h1>PDF<span>.</span></h1>
            <p class="subtitle">
                Organize e prepare seus documentos.
            </p>
        </header>

        <section class="workspace">
            <label for="arquivo" class="dropzone">
                <span class="upload-icon">↑</span>
                <strong>Escolha seu PDF</strong>
                <span>Selecione um documento do dispositivo</span>
                <input type="file" id="arquivo"
                       accept=".pdf,application/pdf">
            </label>

            <p id="nome-arquivo" class="file-info">
                Nenhum arquivo selecionado.
            </p>

            <h2>Operações</h2>

            <label class="operation">
                <input type="checkbox" id="separar-duplas">
                <span class="operation-text">
                    <strong>Separar páginas duplas</strong>
                    <small>
                        Divide cada página digitalizada em duas metades.
                    </small>
                </span>
            </label>

            <p class="hint">
                O corte inicial é feito pelo centro da página.
                Verifique documentos com a dobra fora do centro.
            </p>

            <button id="processar" disabled>
                Processar PDF
            </button>

            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <footer>
            <p>Processamento local no navegador.</p>
        </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
