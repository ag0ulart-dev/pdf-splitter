```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>PDF — Ferramentas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">FERRAMENTAS PARA DOCUMENTOS</p>
            <h1>PDF<span>.</span></h1>
            <p class="subtitle">
                Seus documentos, organizados com simplicidade.
            </p>
        </header>

        <section class="workspace">
            <label for="arquivo" class="dropzone">
                <span class="upload-icon">↑</span>
                <strong>Escolha seu PDF</strong>
                <span>Selecione um documento do seu dispositivo</span>
                <input type="file" id="arquivo" accept=".pdf,application/pdf">
            </label>

            <p id="nome-arquivo" class="file-info">
                Nenhum arquivo selecionado.
            </p>

            <div class="actions">
                <button id="dividir" disabled>Dividir PDF</button>
            </div>

            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <footer>
            <p>Privacidade em primeiro lugar. Processamento local no navegador.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
